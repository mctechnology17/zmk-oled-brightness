# Enable ZMK display support and the OLED brightness module.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

CONFIG_ZMK_OLED_BRIGHTNESS=y
CONFIG_ZMK_OLED_BRIGHTNESS_BEHAVIORS=y

# Standard SSD1306/SH1106 OLEDs use contrast commands over I2C.
CONFIG_ZMK_OLED_BRIGHTNESS_DIRECT_I2C_CONTRAST=y
CONFIG_ZMK_OLED_BRIGHTNESS_DEFAULT=128
CONFIG_ZMK_OLED_BRIGHTNESS_MIN=0
CONFIG_ZMK_OLED_BRIGHTNESS_MAX=255
CONFIG_ZMK_OLED_BRIGHTNESS_STEP=16

# Leave this off unless your display has a real PWM backlight pin.
CONFIG_ZMK_OLED_BRIGHTNESS_PWM_BACKLIGHT=n

# Optional: persist the last contrast/brightness value.
CONFIG_SETTINGS=y
CONFIG_ZMK_OLED_BRIGHTNESS_SETTINGS=y
